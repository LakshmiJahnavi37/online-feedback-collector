
{% extends "base.html" %}

{% block title %}Admin Login | FeedbackHub{% endblock %}

{% block content %}

<section class="panel login-panel">

    <p class="eyebrow">RESTRICTED AREA</p>

    <h1>Admin Sign In</h1>

    <p class="subtitle">
        Sign in to view and manage submitted feedback.
    </p>

    <form method="POST">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <label for="email">Admin Email</label>

        <input
            type="email"
            id="email"
            name="email"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
        >

        <button class="button primary full" type="submit">
            Sign In
        </button>

    </form>

    <a class="text-link" href="{{ url_for('index') }}">
        Back to Feedback Form
    </a>

</section>

{% endblock %}
